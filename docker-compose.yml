services:

  api:
    image: api-server
    ports:
      - "9090:9090"
    environment:
      DATABASE_DSN: postgres://localapi:localapi@postgres:5432/local?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: localapi
      POSTGRES_PASSWORD: localapi
      POSTGRES_DB: local
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - data_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localapi -d local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  data_local_postgres: