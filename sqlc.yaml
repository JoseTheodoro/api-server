version: 2
sql:
  - engine: "postgresql"
    queries: "./internal/repository/postgres/sql"
    schema: "./internal/repository/postgres/migrations"
    gen:
      go:
          package: "queries"
          out: "./internal/repository/postgres/queries"
          sql_package: "pgx/v5"
          emit_pointers_for_null_types: true
          overrides:
            - db_type: "uuid"
              nullable: false
              go_type:
                import: "github.com/google/uuid"
                type: "UUID"
            - db_type: "pg_catalog.timestamptz"
              nullable: false
              go_type:
                  import: "time"
                  type: "Time"
            - db_type: "date"
              nullable: false
              go_type:
                import: "time"
                type: "Time"
            - column: "users.updated_at"
              nullable: true
              go_type:
                import: "time"
                type: "Time"
                pointer: true
            - column: "users.deleted_at"
              nullable: true
              go_type:
                import: "time"
                type: "Time"
                pointer: true
            - column: "users.genre"
              go_type:
                import: "apiserver/internal/domain"
                type: "Genre"