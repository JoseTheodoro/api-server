name: CI Pipeline
run-name: CI Pipeline
on:
  pull_request:
    branches: [main]
jobs:
  running_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
      
